# What Folio shows for this repository (https://oztozlu.dev/play). Every field is optional.
# The repository also needs the `folio-play` topic and its homepage set to the address this game is deployed at.
title: { en: Gates, tr: Kapılar }
summary:
  en: Steer through the gaps as the gates speed up.
  tr: Kapılar hızlanırken aralarından geç.
order: 1                 # earlier than games without one; otherwise newest push first
embed: true              # false: Folio links to the game instead of running it in the page
embedOptions:
  aspect: "16:10"        # the frame's shape on Folio
  orientation: any       # landscape, portrait or any
  input: [keyboard, touch, gamepad]
