# How the Folio controller publishes this repository. Push to main: the workflow tests and builds it, the controller
# checks the build and Folio serves it at https://oztozlu.dev/play/<name>/app/, with a page at /play/<name>.
kind: play                  # play (a game), lab (a lab app) or site (a separate site at <name>.oztozlu.dev)
# name: my-game             # its place in Folio, /play/my-game; by default the repository's name in lower case
title: { en: Gates, tr: Kapılar }
summary:
  en: Steer through the gaps as the gates speed up.
  tr: Kapılar hızlanırken aralarından geç.
order: 1                    # earlier on /play than games without one; the rest newest first
embed: true                 # false: Folio links to the game instead of running it in the page
aspect: "16:10"             # the frame's shape on Folio, width:height
inputs: [keyboard, touch, gamepad]   # shown on the game's card: keyboard, touch, mouse, gamepad
